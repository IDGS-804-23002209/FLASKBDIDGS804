{% extends "layout.html" %}

{% block container %}

<div class="relative bg-neutral-primary-soft max-w-xs w-full p-6 border border-default rounded-base shadow-xs mx-auto mt-10">

    <div class="flex flex-col items-center">

        <!-- Imagen desde carpeta static -->
        <img class="w-24 h-24 mb-6 rounded-full"
             src="{{ url_for('static', filename='img/User.jpeg') }}"
             alt="Alumno image"/>

        <!-- Nombre completo dinámico -->
        <h5 class="mb-1 text-xl font-semibold tracking-tight text-heading">
            {{ nombre }} {{ apaterno }}
        </h5>

        <!-- Correo dinámico -->
        <span class="text-sm text-body">
            {{ email }}
        </span>

        <div class="flex mt-6 gap-4">

            <a href="{{ url_for('index') }}"
               class="inline-flex items-center text-white bg-brand px-4 py-2.5 rounded-base text-sm">
               Regresar
            </a>

        </div>
    </div>
</div>

{% endblock %}
