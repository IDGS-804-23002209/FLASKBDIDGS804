{% extends "layout.html" %}
{% block container %}

<div class="bg-neutral-primary-soft block max-w-sm p-6 border border-default rounded-base shadow-xs mx-auto mt-10">
    <div class="flex justify-center">
        <img class="rounded-full w-24 h-24 border-2 border-brand" 
             src="https://ui-avatars.com/api/?name={{ nombre }}+{{ apellidos }}&background=random" 
             alt="Avatar" />
    </div>

    <div class="text-center">
        <h5 class="mt-6 mb-2 text-2xl font-semibold tracking-tight text-heading">
            {{ nombre }} {{ apellidos }}
        </h5>
        
        <p class="mb-2 text-body">
            <strong>Especialidad:</strong> {{ especialidad }}
        </p>
        
        <p class="mb-6 text-body">
            <strong>Correo electrónico:</strong><br>
            {{ email }}
        </p>

        <a href="{{ url_for('maestros.index') }}" class="inline-flex items-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
            <svg class="w-4 h-4 me-1.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Volver a la lista
        </a>
    </div>
</div>

{% endblock %}
